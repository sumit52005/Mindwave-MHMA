<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | MindEase</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
      box-sizing: border-box;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(162, 217, 255, 0.3), rgba(195, 240, 228, 0.3));
      z-index: -1;
    }
    .signup-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
    }
    .signup-container::before {
      content: '🌿';
      position: absolute;
      top: -20px;
      left: 20px;
      font-size: 2em;
      opacity: 0.7;
    }
    .signup-container::after {
      content: '🌸';
      position: absolute;
      top: -20px;
      right: 20px;
      font-size: 2em;
      opacity: 0.7;
    }
    .input-group {
      text-align: left;
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border-radius: 25px;
      border: 2px solid #e0f2e9;
      font-size: 14px;
      background: rgba(255,255,255,0.8);
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #4caf50;
      outline: none;
    }
    input[type="text"] {
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23666" viewBox="0 0 16 16"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h9z"/></svg>');
      background-repeat: no-repeat;
      background-position: 12px center;
    }
    input[type="email"] {
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23666" viewBox="0 0 16 16"><path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414.05 3.555zM0 4.697v7.104l5.803-3.558L0 4.697zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586l-1.239-.757zm3.436-.586L16 11.801V4.697l-5.803 3.546z"/></svg>');
      background-repeat: no-repeat;
      background-position: 12px center;
    }
    input[type="password"] {
      background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23666" viewBox="0 0 16 16"><path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>');
      background-repeat: no-repeat;
      background-position: 12px center;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }
    #message {
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <div class="nature-elements">
    <div class="leaf" style="left: 10%; animation-delay: 0s;">🍃</div>
    <div class="leaf" style="left: 20%; animation-delay: 2s;">🌿</div>
    <div class="leaf" style="left: 70%; animation-delay: 4s;">🍂</div>
    <div class="leaf" style="left: 80%; animation-delay: 6s;">🌸</div>
  </div>

  <div class="signup-container">
    <h2>Create Your Account 💙</h2>

    <input type="text" id="name" placeholder="Full Name" />
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="signup()">Sign Up</button>
    <div id="message"></div>

    <p>Already have an account? <a href="signin.html">Sign In</a></p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>

  <script>
    async function signup() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.innerText = "";

      if (!name || !email || !password) {
        message.style.color = "red";
        message.innerText = "Please fill all fields.";
        return;
      }

      const { error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name }
        }
      });

      if (error) {
        message.style.color = "red";
        message.innerText = error.message;
      } else {
        message.style.color = "green";
        message.innerText = "Signup successful 🌱 Please sign in.";
        setTimeout(() => window.location.href = "signin.html", 1200);
      }
    }
  </script>

</body>
</html>
