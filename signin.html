<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | MindEase</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(162, 217, 255, 0.3), rgba(195, 240, 228, 0.3));
      z-index: -1;
    }
    .signin-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
    }
    .signin-container::before {
      content: '🌿';
      position: absolute;
      top: -20px;
      left: 20px;
      font-size: 2em;
      opacity: 0.7;
    }
    .signin-container::after {
      content: '🌸';
      position: absolute;
      top: -20px;
      right: 20px;
      font-size: 2em;
      opacity: 0.7;
    }
    input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      margin: 10px 0;
      border-radius: 25px;
      border: 2px solid #e0f2e9;
      font-size: 14px;
      background: rgba(255,255,255,0.8);
      transition: border-color 0.3s;
      position: relative;
      box-sizing: border-box;
    }
    input:focus {
      border-color: #4caf50;
      outline: none;
    }
    input[type="email"]::before {
      content: '📧';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2em;
      color: #666;
      pointer-events: none;
    }
    input[type="password"]::before {
      content: '🔒';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2em;
      color: #666;
      pointer-events: none;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
    }
    #message {
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
    }
    .nature-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }
    .leaf {
      position: absolute;
      font-size: 2em;
      opacity: 0.3;
      animation: float 10s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-100px) rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="nature-elements">
    <div class="leaf" style="left: 10%; animation-delay: 0s;">🍃</div>
    <div class="leaf" style="left: 20%; animation-delay: 2s;">🌿</div>
    <div class="leaf" style="left: 70%; animation-delay: 4s;">🍂</div>
    <div class="leaf" style="left: 80%; animation-delay: 6s;">🌸</div>
  </div>

  <div class="signin-container">
    <h2>Welcome Back 👋</h2>

    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />

    <button onclick="signin()">Sign In</button>
    <div id="message"></div>

    <p>Don’t have an account? <a href="signup.html">Sign Up</a></p>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js"></script>

  <script>
    async function signin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.innerText = "";

      if (!email || !password) {
        message.style.color = "red";
        message.innerText = "Please enter email and password.";
        return;
      }

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.style.color = "red";
        message.innerText = error.message;
      } else {
        message.style.color = "green";
        message.innerText = "Login successful 🌱 Redirecting…";
        setTimeout(() => window.location.href = "explore.html", 1200);
      }
    }
  </script>

</body>
</html>
